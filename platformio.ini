[platformio]
default_envs = cardputer_adv

[env:cardputer_adv]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Cardputer
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DHELLEBORE_VERSION=\"0.1.0\"
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
