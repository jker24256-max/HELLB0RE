name: HELLEBORE CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hellebore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host parser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run host tests
        run: bash test/host/run_tests.sh

  firmware:
    name: Build Cardputer Adv firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio esptool==4.11.0
      - name: Compile firmware
        run: pio run -e cardputer_adv
      - name: Create merged flash image
        run: |
          python -m esptool --chip esp32s3 merge_bin \
            -o .pio/build/cardputer_adv/hellebore-full.bin \
            --flash_mode dio --flash_size 8MB \
            0x0 .pio/build/cardputer_adv/bootloader.bin \
            0x8000 .pio/build/cardputer_adv/partitions.bin \
            0x10000 .pio/build/cardputer_adv/firmware.bin
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellebore-cardputer-adv-firmware
          path: |
            .pio/build/cardputer_adv/hellebore-full.bin
            .pio/build/cardputer_adv/firmware.bin
            .pio/build/cardputer_adv/firmware.elf
            .pio/build/cardputer_adv/partitions.bin
            .pio/build/cardputer_adv/bootloader.bin
          if-no-files-found: error
          retention-days: 90
