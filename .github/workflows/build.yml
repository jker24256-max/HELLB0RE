name: HELLEBORE CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host parser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run host tests
        run: bash test/host/run_tests.sh

  firmware:
    name: Build Cardputer Adv firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Compile firmware
        run: pio run -e cardputer_adv
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: hellebore-cardputer-adv-firmware
          path: |
            .pio/build/cardputer_adv/firmware.bin
            .pio/build/cardputer_adv/firmware.elf
          if-no-files-found: error
          retention-days: 30
